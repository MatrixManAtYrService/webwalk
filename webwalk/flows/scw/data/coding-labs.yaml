# Coding-lab ANSWER KEY — the "what code to write" macros.
#
# A coding lab (engine/coding_lab.py) asks the trainee to WRITE code into a
# cross-origin code-server editor, then Submit — the third SCW task type after
# missions (courses/missions.yaml) and challenges (courses/challenges.yaml). The
# thinking is done once, by hand; what's encoded here is only the ASSOCIATION: a
# lab's content signature -> the full file content to paste for each step.
#
# Matched on the lab's own INTRODUCTION/STEPS text (NOT the task URL), so the same
# key fires on any replay. `steps` is one entry per lab step, in order; the driver
# pastes steps[active_step].content (active_step = how many steps are already done)
# into the editor and clicks Submit, one step per pass. An unmatched lab stops the
# walk with the lab as context so a new key can be added.

coding_labs:
- id: mfa-python-flashpoint
  match:
    text_contains: implementing the second layer in order to have multi-factor authentication
    file: models.py
  steps:
  - content: |
      from typing import List, Optional

      import pyotp
      from sqlalchemy import String
      from sqlalchemy.orm import Mapped, mapped_column, relationship

      from db.base import Base
      from db.enums import Language, Role
      from utils import hash_password, verify_password


      class User(Base):
          __tablename__ = "users"
          id: Mapped[int] = mapped_column(primary_key=True)
          email: Mapped[str] = mapped_column(String(256), unique=True)
          first_name: Mapped[Optional[str]] = mapped_column(String(256))
          last_name: Mapped[Optional[str]] = mapped_column(String(256))
          role: Mapped[Role] = mapped_column(default=Role.CUSTOMER)
          language: Mapped[Language] = mapped_column(default=Language.ENGLISH)
          photos: Mapped[List["Photo"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          photo_books: Mapped[List["PhotoBook"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          orders: Mapped[List["ShoppingOrder"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          password_hash: Mapped[str] = mapped_column(String(256))
          otp_secret: Mapped[Optional[str]] = mapped_column(String(32), unique=True)

          @property
          def is_admin(self) -> bool:
              return self.role == Role.ADMIN

          @property
          def is_2fa_enabled(self) -> bool:
              return False

          def generate_new_otp_secret(self) -> str:
              return pyotp.random_base32()

          def get_2fa_setup_uri(self, otp_secret: str) -> str:
              return pyotp.totp.TOTP(otp_secret).provisioning_uri(
                  name=self.email, issuer_name="FlashPointKiosk"
              )

          def check_otp(self, otp: str) -> bool:
              return True

          def set_password(self, value: str) -> None:
              self.password_hash = hash_password(value)

          password = property(fset=set_password)

          def check_password(self, value: str) -> bool:
              return verify_password(self.password_hash, value)

          def __repr__(self) -> str:
              return f"User(id={self.id!r})"
  - content: |
      from typing import List, Optional

      import pyotp
      from sqlalchemy import String
      from sqlalchemy.orm import Mapped, mapped_column, relationship

      from db.base import Base
      from db.enums import Language, Role
      from utils import hash_password, verify_password


      class User(Base):
          __tablename__ = "users"
          id: Mapped[int] = mapped_column(primary_key=True)
          email: Mapped[str] = mapped_column(String(256), unique=True)
          first_name: Mapped[Optional[str]] = mapped_column(String(256))
          last_name: Mapped[Optional[str]] = mapped_column(String(256))
          role: Mapped[Role] = mapped_column(default=Role.CUSTOMER)
          language: Mapped[Language] = mapped_column(default=Language.ENGLISH)
          photos: Mapped[List["Photo"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          photo_books: Mapped[List["PhotoBook"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          orders: Mapped[List["ShoppingOrder"]] = relationship(back_populates="user", cascade="all, delete-orphan")
          password_hash: Mapped[str] = mapped_column(String(256))
          otp_secret: Mapped[Optional[str]] = mapped_column(String(32), unique=True)

          @property
          def is_admin(self) -> bool:
              return self.role == Role.ADMIN

          @property
          def is_2fa_enabled(self) -> bool:
              return self.otp_secret is not None

          def generate_new_otp_secret(self) -> str:
              return pyotp.random_base32()

          def get_2fa_setup_uri(self, otp_secret: str) -> str:
              return pyotp.totp.TOTP(otp_secret).provisioning_uri(
                  name=self.email, issuer_name="FlashPointKiosk"
              )

          def check_otp(self, otp: str) -> bool:
              return pyotp.TOTP(self.otp_secret).verify(otp)

          def set_password(self, value: str) -> None:
              self.password_hash = hash_password(value)

          password = property(fset=set_password)

          def check_password(self, value: str) -> bool:
              return verify_password(self.password_hash, value)

          def __repr__(self) -> str:
              return f"User(id={self.id!r})"

- id: insecure-deserialization-python-flashpoint
  # "Implement JSON data format" — swap pickle for json in serializer.py to avoid
  # native (de)serialization. ONE step, two tasks (serialize + deserialize); the
  # whole-file paste covers both at once. Matched on the intro's distinctive
  # vulnerability name (always in the frame text) rather than the editor tab, which
  # isn't reliably captured as the filename. Solved + captured live 2026-07-13.
  match:
    text_contains: insecure deserialization or object injection
  steps:
  - content: |
      import json
      import logging

      logger = logging.getLogger(__name__)


      class SerializerService:
          @staticmethod
          def serialize(obj: dict):
              return json.dumps(obj)

          @staticmethod
          def deserialize(data) -> dict:
              result = json.loads(data)
              if not isinstance(result, dict):
                  logger.warning("Failed deserialization: data is not a dict.")
                  raise ValueError("Invalid data.")

              return result

- id: ssrf-api-python-flashpoint
  # "SSRF" lab on api.py — the Flashpoint image-download feature lacks URL validation.
  # THREE cumulative steps, one task each: (1) validate_scheme allowlists ALLOWED_SCHEMES
  # via urlparse(...).scheme; (2) validate_host allowlists ALLOWED_HOSTS via
  # urlparse(...).hostname; (3) RedirectHandler.http_error_307 raises if "location" not
  # in headers (the open-redirect task, worded literally by SCW). Each step's content is
  # the WHOLE file with all fixes THROUGH that step (paste replaces the file). Solved +
  # validated LIVE end-to-end 2026-07-13 (steps 1/2/3 complete → lab done). NOTE: the pod
  # Submit is flaky — a first click can return "Error submitting solution"; the runner
  # self-heals because active_step stays put, so do-coding-lab re-pastes + re-submits.
  match:
    text_contains: The fetch_image method fetches an image
    file: api.py
  steps:
  - content: |
      import logging
      from urllib.parse import urlparse
      from urllib.request import build_opener, HTTPRedirectHandler, install_opener, urlretrieve

      from utils import encode_url

      logger = logging.getLogger(__name__)


      class RedirectHandler(HTTPRedirectHandler):
          def http_error_307(self, req, fp, code, msg, headers):
              return super().http_error_307(req, fp, code, msg, headers)

          http_error_301 = http_error_302 = http_error_303 = http_error_307


      class ApiService:
          ALLOWED_SCHEMES = ("https",)
          ALLOWED_HOSTS = ("flashpointkiosk.com",)

          def __init__(self, url):
              self.url = url

          def validate_scheme(self) -> bool:
              return urlparse(self.url).scheme in self.ALLOWED_SCHEMES

          def validate_host(self) -> bool:
              return True

          def fetch_image(self) -> str:
              if not self.validate_scheme():
                  logger.error(f"Not allowed scheme for url: {encode_url(self.url)}")
                  raise Exception("The scheme is not allowed.")

              if not self.validate_host():
                  logger.error(f"Not allowed host for url: {encode_url(self.url)}")
                  raise Exception("The host is not allowed.")

              opener = build_opener(RedirectHandler)
              install_opener(opener)

              try:
                  local_filename, headers = urlretrieve(self.url)
                  return local_filename
              except Exception as e:
                  logger.exception("Failed to retrieve image.", exc_info=True)
                  raise Exception("Failed to retrieve image.") from e
