# State signatures for the Fiserv / Secure Code Warrior flow.
#
# Each state is a way to recognize "where we are" from an `observe` payload.
# The engine matches the live browser against these to answer "where am I?".
# Signals are intentionally minimal + stable (ids, hrefs, frame+text) rather
# than position- or date-dependent. Add states as we discover them.

# When the walker stops, its `context.network` view is filtered to these host
# substrings so the training's own API stands out from RUM/analytics noise
# (Coralogix et al). Purely a diagnostics filter — capture still records all.
api_hosts:
  - securecodewarrior.com

states:
  # --- Microsoft (Entra) SSO, used by both Fiserv and the Clover/SCW hop ---
  - id: ms-login-username
    url_contains: login.microsoftonline.com
    elements:
      - { id: i0116 }                      # the email/username field

  - id: ms-login-password
    url_contains: login.microsoftonline.com
    elements:
      - { type: password }

  - id: ms-mfa-code
    url_contains: login.microsoftonline.com
    elements:
      - { id: idTxtBx_SAOTCC_OTC }         # authenticator one-time-code field

  # --- Fiserv FUEL (SharePoint) home ---
  - id: fuel-home
    url_contains: sharepoint.com/sites/fuel-home
    elements:
      - { href_contains: "signin/Xchange" }

  # --- Cornerstone LMS ---
  - id: lms-learner-home
    url_contains: csod.com/ui/lms-learner-home

  - id: lms-curriculum
    url_contains: csod.com/ui/training/app
    elements:
      - { text: Launch }                   # the (top-level) curriculum Launch button

  - id: course-player-launch
    url_contains: csod.com/ui/training/app
    elements:
      - { frame: [3, 1], text: Launch Course }   # inner launcher, two frames deep

  # --- Secure Code Warrior ---
  - id: scw-login
    url_contains: portal.securecodewarrior.com/#/login
    elements:
      - { id: email }

  - id: scw-language-list
    url_contains: courses/course-list
    elements:
      - { frame: [0], text_contains: Python Basic }

  - id: scw-course-breakdown
    url_contains: /breakdown/
    elements:
      - { frame: [0], text: Resume }

  # An in-course activity (video/code/quiz). Discovered by running `resume-course`
  # from the breakdown: Resume drops you into the current task. Keyed on the stable
  # /course-task/ URL; task subtypes (Video/…) can be split out later if a rule
  # needs to tell them apart. The title here was "Video | Courses | …".
  - id: scw-course-task
    url_contains: /course-task/

  # A video activity specifically — same URL, but the title is "Video | …". This
  # overlaps scw-course-task (both match), so the runner considers rules for both
  # and the more specific `video-advance` is ordered first. Videos gate Continue
  # until watched; see the video-advance rule + docs/video-gate-hypothesis.md.
  - id: scw-video-task
    url_contains: /course-task/
    title_contains: "Video"

  # A mission — an interactive, server-verified challenge on its OWN URL shape
  # (#/mission/course/…, NOT /course-task/). Resume can drop you here instead of a
  # course-task. The mocked target app (e.g. Viking Bank) lives in frame [0,0,0];
  # there's no cheap API skip — the pod verifies real actions. See docs/mission-api.md.
  - id: scw-mission
    url_contains: /mission/course/
    title_contains: "Mission"

  # A COMPLETED mission — same /mission/course/ URL, but the results panel is now
  # showing with a "Continue" button in frame [0,0] (the mission player chrome).
  # That button is absent while a mission is in progress, so it cleanly tells "done"
  # apart from "in progress". Both this and scw-mission match a finished mission;
  # the `mission-continue` rule is listed first so it wins (see applicable_rules).
  # Confirmed live on vb-52: on completion the panel reads "Congratulations! You
  # have successfully completed this mission!" above the Continue button.
  - id: scw-mission-complete
    url_contains: /mission/course/
    elements:
      - { frame: [0, 0], text: Continue }

  # A challenge task — "locate/fix the vulnerability". Its own URL shape
  # (/courses/task/challenge/…, NOT /course-task/ or /mission/course/). Continue
  # off a completed mission lands here. The code panes + selectable line-blocks
  # live in frame [0]; solving it needs real judgement (pick the vulnerable block),
  # so there's no rule yet — the walker stops here with context. Discovered live.
  - id: scw-challenge
    url_contains: /courses/task/challenge/
    title_contains: "Challenge"

  # A completion/"Results" overlay that pops OVER a solved challenge stage (the
  # "Bingo! You got that one right!" dialog) with a Continue button in the player
  # frame [0]. Its URL/title are unchanged, so it also matches scw-challenge — the
  # dismiss rule is ordered first so it wins (applicable_rules is greedy). The
  # distinctive tell is the pair of dialog buttons "Review code" + "Continue" in
  # frame [0]: a plain course-task has a Continue but never a "Review code", so this
  # signature can't fire on one. Discovered live 2026-07-13 (locate -> fix -> done).
  #
  # GENERAL PATTERN: a success overlay must be checked BEFORE acting on the state
  # underneath it (else the walk clicks blindly under the dialog — a recurring trap).
  # Model each such overlay as its own state whose signature is a dialog-only
  # element, and order its dismiss rule ahead of the underlying state's rules.
  - id: scw-challenge-result
    url_contains: /courses/task/challenge/
    elements:
      - { frame: [0], tag: button, text: "Review code" }
      - { frame: [0], tag: button, text: "Continue" }

# Rules describe how to move between states: in state `when`, do `do`, and expect
# to land in `expect`. The rule runner (engine/runner.py) observes → matches the
# `when` → acts → re-observes to verify. `expect` is optional: omit it while the
# destination state is still undiscovered — the runner reports where the action
# actually landed so its signature can be added above. See docs/rule-runner-design.md.
rules:
  # OVERLAY-FIRST: dismiss a challenge "Results" success dialog before anything
  # else. Listed at the TOP so that whenever scw-challenge-result matches (it
  # overlaps scw-challenge — same URL/title), this wins over do-challenge and the
  # walk never acts on the editor buried under the dialog. The Continue button is
  # in the player frame [0] and has no id, so target it by text. It lands on
  # whatever the dialog gates: the challenge's next stage (locate -> fix), or the
  # next activity once the whole challenge is done.
  - id: dismiss-challenge-result
    when: scw-challenge-result
    do:
      ui: { action: click, frame: [0], by: xpath,
            selector: "//button[normalize-space(.)='Continue']", settle: 4 }
    expect: [scw-challenge, scw-course-task, scw-course-breakdown, scw-mission]

  # Resume the training from the course-breakdown page. The button has no id, so
  # target it by text — case-insensitively, because XPath matches the raw DOM text
  # (which may differ in case from the CSS-rendered "Resume"; see the README).
  - id: resume-course
    when: scw-course-breakdown
    do:
      ui:
        action: click
        frame: [0]
        by: xpath
        selector: '//button[contains(translate(normalize-space(.), "RESUME", "resume"), "resume")]'
        settle: 3          # SPA needs a moment to load the resumed activity
    # Resume lands on whichever activity is current — a course-task, a mission, OR a
    # challenge. `expect` accepts any, so the step verifies against reality rather
    # than assuming one shape (observed live: Resume → a mission, and → a challenge).
    expect: [scw-course-task, scw-mission, scw-challenge]

  # Advance past a VIDEO via the API instead of watching it. The gate is a POST to
  # the task attempt's /answer endpoint; auth is the X-Session-ID header (value =
  # localStorage.sessionId), NOT a bearer token. Full derivation in
  # docs/video-gate-hypothesis.md. Steps: read the session id + the four id
  # segments from the /course-task/ URL; GET /challenges to learn this task's
  # taskAttemptId + type; POST {} to /answer (only if it really is a video);
  # then re-enter (Back to course → Resume) so the SPA re-syncs and moves on — an
  # out-of-band write doesn't refresh the Continue button in place.
  - id: video-advance
    when: scw-video-task
    do:
      - http:
          context:
            sid:    { eval: "localStorage.sessionId" }
            course: { url_regex: "/course-task/([^/]+)/([^/]+)/([^/]+)/([^/]+)", group: 1 }
            lang:   { url_regex: "/course-task/([^/]+)/([^/]+)/([^/]+)/([^/]+)", group: 2 }
            mod:    { url_regex: "/course-task/([^/]+)/([^/]+)/([^/]+)/([^/]+)", group: 3 }
            task:   { url_regex: "/course-task/([^/]+)/([^/]+)/([^/]+)/([^/]+)", group: 4 }
          requests:
            - method: GET
              url: "https://portal-api.securecodewarrior.com/courses/userCourse/{course}/language/{lang}/module/{mod}/task/{task}/challenges"
              headers: { X-Session-ID: "{sid}" }
              capture: { attempt: taskAttemptId, ttype: taskType }
            - method: POST
              only_if: "{ttype}==video"
              url: "https://portal-api.securecodewarrior.com/courses/challenges/language/{lang}/module/{mod}/taskAttempt/{attempt}/answer"
              headers: { X-Session-ID: "{sid}" }
              body: "{}"
      - ui: { action: click, frame: [0], by: xpath, selector: "//a[contains(normalize-space(.),'Back to course')]", settle: 2 }
      - ui: { action: click, frame: [0], by: xpath, selector: '//button[contains(translate(normalize-space(.),"RESUME","resume"),"resume")]', settle: 3 }
    # Ends on the same Resume as resume-course, so it lands on whatever activity is
    # now current — the next task, a mission, or a challenge. Confirmed live: a
    # video-advance landed on the course's second mission. Accept any of them so
    # the walk keeps going instead of flagging `unexpected`.
    expect: [scw-course-task, scw-mission, scw-challenge]

  # Advance off a COMPLETED mission via the results-panel "Continue" button. Listed
  # BEFORE do-mission so that when a finished mission matches both scw-mission and
  # scw-mission-complete, this wins (applicable_rules is greedy, file order). The
  # button is in the player chrome, frame [0,0]. Confirmed live on vb-52: Continue
  # here lands on the follow-up challenge task.
  - id: mission-continue
    when: scw-mission-complete
    do:
      ui: { action: click, frame: [0, 0], by: xpath,
            selector: "//button[normalize-space(.)='Continue']", settle: 4 }
    expect: [scw-challenge, scw-course-task, scw-course-breakdown]

  # Drive a mission via its step sub-loop (engine/mission.py + courses/missions.yaml).
  # The runner reads the current step, matches it against the shared step-handler
  # library, drives it, and verifies the pod ticked that step's checkbox (the
  # synchronous, observable signal — see docs below). On completion the outer loop
  # re-observes: the results "Continue" now shows, so scw-mission-complete matches
  # and `mission-continue` carries the walk onward (no dead stop at mission end).
  - id: do-mission
    when: scw-mission
    do: { mission: {} }

  # Answer a challenge via the answer-key library (engine/challenge.py +
  # courses/challenges.yaml). The runner reads the decision view embedded in the
  # observe snapshot, matches it to its pre-solved answer, and fires the option's
  # select + Submit acts — one decision per pass. A solved decision either raises
  # the "Results" overlay (dismiss-challenge-result carries it onward) or reveals
  # the next stage, which the outer loop re-enters here. An un-encoded challenge
  # stops the walk with the decision view as context so an answer key can be added.
  # Ordered AFTER dismiss-challenge-result so the overlay is always cleared first.
  - id: do-challenge
    when: scw-challenge
    do: { challenge: {} }
    expect: [scw-challenge-result, scw-challenge, scw-course-task, scw-course-breakdown]

  # Advance to the next activity. NOTE: Continue is disabled until the task is
  # complete (for a video, until it's watched to the end — see
  # docs/video-gate-hypothesis.md). This rule only succeeds when it's enabled;
  # against a disabled button it returns a readable 422 and the walk stops. Case-
  # insensitive text match for the same DOM-vs-rendered reason as resume-course.
  - id: continue-task
    when: scw-course-task
    do:
      ui:
        action: click
        frame: [0]
        by: xpath
        selector: '//button[contains(translate(normalize-space(.), "CONTINUE", "continue"), "continue")]'
        settle: 3
    # expect: (unknown) — discover the next activity by running this rule.
