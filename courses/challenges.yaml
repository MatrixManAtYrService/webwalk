# Challenge ANSWER KEY — the "which option is the answer" macros.
#
# A challenge (engine/challenge.py) is a decision among fixed options: LOCATE the
# vulnerable block, or pick the correct FIX. The *thinking* — read the code, pick
# the answer — is done once, by hand. What's encoded here is only the ASSOCIATION:
# a stable content-signature that uniquely identifies a specific challenge -> the
# option to select. This mirrors courses/missions.yaml one level down: a mission
# step-handler matches a step's own title/description; a challenge handler matches
# the challenge's own decision view (stage, vulnerability, file, candidate blocks).
#
# Matched on content, NOT on the task URL, so the same key fires on any replay.
# `answer.select` names the option by its stable `id` — a `file:from-to` range in
# the locate stage, the integer solution number in the fix stage. (`answer.code_regex`
# is a locate-stage alternative that matches the highlighted block's code instead,
# robust to line-number drift, but it needs the scraper's code fields — see the
# challenge-editor memory.) An unmatched challenge stops the walk with the decision
# view as context so a new key can be added — after which it, too, runs hands-off.

challenges:
  # Module 3 (Broken Authentication) — "Session Handling - Exposed Session Tokens",
  # Python. LOCATE stage: 4 highlighted blocks across auth.py + config.py. The vuln
  # is that the session id is written into the redirect URL —
  #   auth.py:34-36  self.send_header('Location', 'https://localhost/?sessionid=%s' % cookie['sessionid'].value)
  # — which leaks the token via history, logs, and Referer headers. The other blocks
  # are safe: auth.py:24-25 generates the id with secrets.choice (secure), config.py
  # sets Argon2 as the hasher (26) and the CA key path (37-38). Solved + validated
  # live 2026-07-13. The full candidate set fingerprints THIS challenge so the key
  # can't fire on a different task that merely shares the vulnerability category.
  - id: exposed-session-tokens-locate
    match:
      stage: locate
      vulnerability_contains: "Exposed Session Tokens"
      options_include: ["auth.py:24-25", "auth.py:34-36", "config.py:26-26", "config.py:37-38"]
    answer:
      select: "auth.py:34-36"

  # Same challenge, FIX stage (reached after the locate success overlay's Continue).
  # 4 candidate solutions; solution 3 is correct — it moves the token out of the URL
  # into a Set-Cookie header AND keeps the hardening (secure=True, httponly=True,
  # HTTPS/443 with the TLS socket wrap). The distractors each reintroduce a flaw:
  # sol 1 base64-encodes the id but still puts it in the URL; sol 2 sets secure=False
  # and serves over plain HTTP (port 80, no TLS wrap); sol 4 sets httponly=False
  # (readable by JS → XSS theft). Solved + validated live 2026-07-13. Fix-stage
  # options are just 1..N, so the vulnerability category + file disambiguate here.
  # NOTE: `select` is the solution's on-screen NUMBER; if SCW ever shuffles the
  # solution order this must move to content-matching the right pane.
  - id: exposed-session-tokens-fix
    match:
      stage: fix
      vulnerability_contains: "Exposed Session Tokens"
      file: "auth.py"
    answer:
      select: 3

  # Access Control — "Insecure Direct Object Reference" (IDOR), Python. LOCATE stage:
  # 4 highlighted blocks across auth.py + users.py. The vuln is that
  #   auth.py:70-93  def roles(self, user_id=None): … WHERE user_roles.user_id = %(user_id)s
  # accepts a CALLER-SUPPLIED user_id and returns that user's roles with no ownership
  # check — its `@is_authorized` only proves you're logged in, not that the id is
  # yours — so any user can read anyone's roles by id (the direct object reference).
  # The other blocks are safe: auth.py:24-34 is a parameterized login query (no SQLi);
  # users.py:102-105 and 124-151 are the CORRECT guards — each calls self.roles() with
  # no arg (→ self.id) and gates on 'administrator' in roles. Solved + validated live
  # 2026-07-13 (select → "Bingo!" success overlay). Full candidate set fingerprints
  # THIS challenge so the key can't fire on another IDOR task sharing the category.
  - id: idor-roles-locate
    match:
      stage: locate
      vulnerability_contains: "Insecure Direct Object Reference"
      options_include: ["auth.py:24-34", "auth.py:70-93", "users.py:102-105", "users.py:124-151"]
    answer:
      select: "auth.py:70-93"

  # Insecure Cryptography — "Weak Algorithm Use", Python. LOCATE stage: 4 blocks across
  # auth.py + config.py. The vuln is the password-hashing algorithm choice —
  #   config.py:26  PASSWORD_HASHER = 'UnsaltedMD5PasswordHasher'
  # — unsalted MD5 is fast and broken, so a leaked hash is trivially reversed (the very
  # premise of the paired rainbow-table mission). The others are benign: auth.py:49 just
  # reads the submitted password, auth.py:69-75 is a parameterized INSERT, config.py:34
  # loads SECRET_KEY from the environment. Solved + validated live 2026-07-13 (→ "Bingo!").
  - id: weak-hash-algorithm-locate
    match:
      stage: locate
      vulnerability_contains: "Weak Algorithm Use"
      options_include: ["auth.py:49-49", "auth.py:69-75", "config.py:26-26", "config.py:34-34"]
    answer:
      select: "config.py:26-26"

  # Insecure Cryptography — "Insecure Randomness", Python. LOCATE stage: 4 blocks across
  # auth.py + clients.py. The vuln is generating a security-sensitive value with the
  # non-cryptographic Mersenne-Twister PRNG —
  #   auth.py:28-29  cookie['sessionid'] = ''.join(random.choice(allowed_chars) for i in range(32))
  # — `random` is predictable, so the session id is guessable; it must be `secrets.choice`
  # (cf. the exposed-session-tokens challenge, where the SECURE variant used secrets). The
  # others are benign: auth.py:109-110 just invokes the reset-token generator, auth.py:138
  # is a TLS starttls, clients.py:18-19 loads the password hasher. Solved + validated live
  # 2026-07-13 (→ "Bingo!").
  - id: insecure-randomness-locate
    match:
      stage: locate
      vulnerability_contains: "Insecure Randomness"
      options_include: ["auth.py:28-29", "auth.py:109-110", "auth.py:138-138", "clients.py:18-19"]
    answer:
      select: "auth.py:28-29"

  # Vulnerable Components — "Using Components From Untrusted Source", Python. LOCATE stage:
  # 4 blocks across comment_xml.py + requirements.txt. The vuln is the dependency source —
  #   requirements.txt:4  -e git+https://github.com/untrusted/defusedxml.git#egg=defusedxml
  # — an editable install of defusedxml from an arbitrary GitHub repo (github.com/untrusted)
  # instead of the vetted PyPI package, so whatever that repo ships runs in your app. The
  # others are benign: requirements.txt:1 is a normal pinned `pymongo==4.12.0`, and the
  # comment_xml.py blocks (import MongoConnection; etree.parse in a try/except) are unrelated
  # distractors. Solved + validated live 2026-07-13 (→ "Success").
  - id: untrusted-component-locate
    match:
      stage: locate
      vulnerability_contains: "Untrusted Source"
      options_include: ["comment_xml.py:5-5", "comment_xml.py:25-29", "requirements.txt:1-1", "requirements.txt:4-4"]
    answer:
      select: "requirements.txt:4-4"

  # Vulnerable Components — "Using Known Vulnerable Components", Python. LOCATE stage:
  # 4 blocks across connect.py + requirements.txt. The vuln is a dependency pinned to a
  # version with a published CVE —
  #   requirements.txt:1  pymongo==2.5
  # — PyMongo < 2.5.1 is affected by CVE-2013-2132 (NULL-pointer DoS); it must be bumped
  # to a fixed release. The others are benign: requirements.txt:3 `PyYAML==6.0.3` and
  # requirements.txt:4 `defusedxml==0.6.0` are current/safe pins, and the connect.py
  # blocks (the pymongo import at :5 and the MongoClient(...) setup at :14-27) are the
  # code that USES the component, not the vulnerable component itself. Distinct from
  # `untrusted-component-locate` (category "Untrusted Source", a git-URL dependency) —
  # here the source is trusted PyPI but the pinned VERSION is known-vulnerable. Solved +
  # validated live 2026-07-13.
  - id: known-vulnerable-component-locate
    match:
      stage: locate
      vulnerability_contains: "Known Vulnerable Components"
      options_include: ["connect.py:5-5", "connect.py:14-27", "requirements.txt:1-1", "requirements.txt:3-3"]
    answer:
      select: "requirements.txt:1-1"

  # Same known-vulnerable-component challenge, FIX stage. 4 candidate solutions, each
  # rewriting requirements.txt line 1 (the `pymongo==2.5` pin); solution 2 is correct —
  #   pymongo==4.12.0
  # a current, maintained PyPI release with no known CVE (SCW's own baseline "good" pin,
  # cf. untrusted-component-fix). The distractors each fall short: sol 1
  # `-e git+https://github.com/mongodb/mongo-python-driver.git@2.5.1#egg=pymongo` reaches
  # a patched tag but reintroduces the editable-git-install anti-pattern (and stays on the
  # ancient 2.5 line); sol 3 `pymongo==2.5.1` is only the minimal CVE-2013-2132 patch —
  # still a 2013 release carrying later known CVEs; sol 4 `pymongo==2.4.1` is a DOWNGRADE,
  # still vulnerable. The fix is to upgrade to a currently-maintained version, not merely
  # to the next patch. Determined live 2026-07-13; re-verify the success overlay on replay.
  # NOTE: `select` is the on-screen solution NUMBER; if SCW shuffles order this must move to
  # content-matching the right pane (the `pymongo==4.12.0` line) — but fix options carry no
  # code in the scrape, so re-read the panes by hand if the number ever changes.
  - id: known-vulnerable-component-fix
    match:
      stage: fix
      vulnerability_contains: "Known Vulnerable Components"
      file: "requirements.txt"
    answer:
      select: 2

  # Injection Flaws — "Deserialization of Untrusted Data", Python. LOCATE stage: 4 blocks
  # across clients.py + vehicles.py. The vuln is deserializing with the UNSAFE YAML loader —
  #   clients.py:157  client = yaml.load(stream, Loader=yaml.Loader)
  # — `yaml.Loader` can construct arbitrary Python objects from the input, so untrusted YAML
  # → RCE; it must be `yaml.safe_load` / `SafeLoader`. The others are benign/other-category:
  # clients.py:75-79 is a parameterized SQL INSERT, clients.py:111 is etree.parse with an
  # explicit parser, vehicles.py:35-39 is a Mongo $regex query (a NoSQLi shape, not deserialization).
  # Solved + validated live 2026-07-13 (→ "Success").
  - id: unsafe-deserialization-locate
    match:
      stage: locate
      vulnerability_contains: "Deserialization of Untrusted Data"
      options_include: ["clients.py:75-79", "clients.py:111-111", "clients.py:157-157", "vehicles.py:35-39"]
    answer:
      select: "clients.py:157-157"

  # Same deserialization challenge, FIX stage. 4 candidate solutions; solution 1 is correct —
  #   client = yaml.safe_load(stream)
  # which restricts construction to plain Python types (no arbitrary object instantiation).
  # The distractors are sharp: sol 2 keeps `yaml.load(..., Loader=yaml.UnsafeLoader)` (still
  # RCE), sol 4 keeps `Loader=yaml.Loader` (just renames the stream var), and sol 3 is the
  # trap — it edits an UNRELATED line (adds `f = open(client_yaml)`) while LEAVING the unsafe
  # `yaml.load(stream, Loader=yaml.Loader)` intact further down. Reading only the headline
  # `safe_load` line would have picked 3; reading its full context (per the compare-all rule)
  # shows the vuln survives. Solved + validated live 2026-07-13 (→ "Success").
  # NOTE: `select` is the on-screen NUMBER; if SCW shuffles order, content-match `safe_load`.
  - id: unsafe-deserialization-fix
    match:
      stage: fix
      vulnerability_contains: "Deserialization of Untrusted Data"
    answer:
      select: 1

  # Same untrusted-component challenge, FIX stage. 4 candidate solutions, each rewriting
  # requirements.txt line 4; solution 4 is correct — `defusedxml==0.6.0`, the official
  # PyPI package pinned to a version (a trusted, verifiable source). Every distractor keeps
  # an untrusted/non-standard source: sol 1 `-e git+file:///…/defusedxml_v0.3` (local editable
  # path), sol 2 `-e git+https://github.com/untrusted/…@v0.6.0` (still the untrusted repo, just
  # tagged), sol 3 `-e git+git://github.com/untrusted/…@master` (untrusted repo + cleartext
  # git:// + unpinned master). Answer determined live 2026-07-13; the success overlay wasn't
  # observed because the browser session dropped at submit — re-verify on next pass.
  # NOTE: `select` is the on-screen solution NUMBER; if SCW shuffles order, move to
  # content-matching the right pane (the `defusedxml==` PyPI line).
  # NOTE: no `file:` constraint — the fix stage's open tab may default to comment_xml.py
  # (where the locate stage opened), not requirements.txt, and the vulnerability category
  # alone uniquely identifies this challenge.
  - id: untrusted-component-fix
    match:
      stage: fix
      vulnerability_contains: "Untrusted Source"
    answer:
      select: 4

  # Same insecure-randomness challenge, FIX stage. 4 candidate solutions; solution 4 is
  # correct — it uses `secrets.choice(allowed_chars)` AND a large charset
  # (`'abcdefghijklmnopqrstuvwxyz' + '0123456789'`), so the 32-char session id is both
  # unpredictable and infeasible to brute-force. The distractors are instructive:
  #   sol 1  str(random.randint(0,9))      — non-CSPRNG AND digits only
  #   sol 2  random.shuffle(allowed_chars) — non-CSPRNG; just a permutation of a fixed set
  #   sol 3  secrets.choice BUT allowed_chars = '0123456789' — CSPRNG yet only 10^32-space
  #          of DIGITS; SCW explicitly fails this ("the limited number of choices … makes it
  #          insecure … predict … using brute force"). Selecting 3 first cost a live retry —
  #          the fix is BOTH a strong RNG and a large alphabet, not either alone.
  # Solved + validated live 2026-07-13 (3 → "Failed" hint, then 4 → "Success").
  # NOTE: `select` is the on-screen solution NUMBER; if SCW shuffles order this must move to
  # content-matching the right pane (match on `secrets.choice` + the alphabetic charset).
  - id: insecure-randomness-fix
    match:
      stage: fix
      vulnerability_contains: "Insecure Randomness"
      file: "auth.py"
    answer:
      select: 4

  # Same weak-hashing challenge, FIX stage. 4 candidate solutions, each editing config.py
  # (the PASSWORD_HASHER) AND auth.py (the encode() call); solution 1 is correct — it sets
  #   config.py  PASSWORD_HASHER = 'Argon2PasswordHasher'   (a slow, modern, salted KDF)
  #   auth.py    self.password_hasher.encode(password, self.salt.decode())  (salted)
  # The distractors: sol 3 is 'PlainTextPassword' with an UNsalted encode (catastrophic);
  # sol 2 uses 'BCryptSHA256PasswordHasher' — genuinely secure, so it's the near-miss, but
  # Argon2 is SCW's preferred answer here; sol 4 also reads as Argon2+salt (indistinguishable
  # from 1 in the scraped diff — pick 1). Solved + validated live 2026-07-13.
  # NOTE: `select` is the on-screen solution NUMBER; if SCW shuffles order this must move to
  # content-matching the right pane (as the module note above warns).
  - id: weak-hash-algorithm-fix
    match:
      stage: fix
      vulnerability_contains: "Weak Algorithm Use"
      file: "auth.py"
    answer:
      select: 1

  # Same IDOR challenge, FIX stage (reached after the locate success overlay's Continue).
  # 4 candidate solutions; solution 1 is correct — it DROPS the caller-supplied
  # identifier entirely (`def roles(self):`) and binds the query to `self.id`, so the
  # method can only ever return the current user's own roles. Every distractor keeps an
  # attacker-controllable parameter with an `OR` branch, preserving the IDOR by another
  # name: sol 2 adds `username`, sol 3 adds `role_id`, sol 4 adds `email` — each still
  # lets you reference another user's roles. Solved + validated live 2026-07-13.
  # NOTE: `select` is the solution's on-screen NUMBER; if SCW ever shuffles the order
  # this must move to content-matching the right pane (as the module note above warns).
  - id: idor-roles-fix
    match:
      stage: fix
      vulnerability_contains: "Insecure Direct Object Reference"
      file: "auth.py"
    answer:
      select: 1

  # XML External Entities (XXE) — Python, provider_xml.py. LOCATE stage: 4 highlighted
  # blocks across provider_xml.py + provider.py. The vuln is
  #   provider_xml.py:19  parser.setFeature(handler.feature_external_ges, True)
  # — enabling external general entities on the SAX parser makes it resolve <!ENTITY …
  # SYSTEM '…'> references, so a crafted DOCTYPE can read local files (the paired mission
  # exfiltrates wwwroot/backup/CreateDefaultAdmin.sql this exact way). The others are safe:
  # provider_xml.py:35-40 is a parameterized INSERT (no SQLi), provider_xml.py:58-58 is a
  # plain xmltodict.parse of an already-built string, provider.py:20-25 is unrelated. Solved
  # + validated live 2026-07-13 (→ "Bingo!" success overlay). The full candidate set
  # fingerprints THIS challenge so the key can't fire on another XXE task sharing the category.
  - id: xxe-external-ges-locate
    match:
      stage: locate
      vulnerability_contains: "XML External Entities"
      options_include: ["provider_xml.py:19-19", "provider_xml.py:35-40", "provider_xml.py:58-58", "provider.py:20-25"]
    answer:
      select: "provider_xml.py:19-19"

  # Same XXE challenge, FIX stage (reached after the locate success overlay's Continue).
  # 4 candidate solutions; solution 1 is correct — it swaps the SAX parser for
  # defusedxml's DefusedXMLParser(forbid_dtd=True, forbid_entities=True, forbid_external=True),
  # which blocks DTDs, entity declarations, AND external resource access — the complete,
  # library-endorsed XXE defence. The distractors all fall short: sol 2 uses lxml with
  # resolve_entities=True + no_network=False (resolves entities AND allows network — still
  # fully vulnerable); sol 3 is lxml resolve_entities=True + no_network=True (blocks network
  # but STILL resolves entities, so local-file XXE — this mission's actual attack — keeps
  # working); sol 4 leaves the original vulnerable make_parser/feature_external_ges=True code
  # untouched. Solved + validated live 2026-07-13 (→ "Bingo!"). NOTE: `select` is the
  # on-screen solution NUMBER; if SCW ever shuffles order this must move to content-matching
  # the right pane (as the module notes above warn).
  - id: xxe-external-ges-fix
    match:
      stage: fix
      vulnerability_contains: "XML External Entities"
      file: "provider_xml.py"
    answer:
      select: 1

  # Insufficient Logging and Monitoring — Python, __init__.py + logging_config.py. LOCATE
  # stage: 4 highlighted blocks. The vuln is the console log handler —
  #   logging_config.py:22-28  'console': {'class': 'logging.StreamHandler',
  #                              'formatter': 'simple', 'level': 'INFO'}
  # — it's the ONLY handler (console/StreamHandler = ephemeral stdout, nothing persisted for
  # monitoring) AND it uses the 'simple' formatter, which OMITS %(asctime)s, so log lines have
  # no timestamp — useless for an incident timeline. (A 'detailed' formatter WITH asctime is
  # defined right above but goes unused.) The others are safe: __init__.py:5-5 just applies the
  # config (dictConfig), logging_config.py:17-20 is the 'simple' formatter definition itself,
  # and :10-10 is disable_existing_loggers (a red herring — tried it live, got Retry). Solved +
  # validated live 2026-07-13 (block 22-28 → "Bingo!"). Full candidate set fingerprints this one.
  - id: insufficient-logging-locate
    match:
      stage: locate
      vulnerability_contains: "Insufficient Logging"
      options_include: ["__init__.py:5-5", "logging_config.py:10-10", "logging_config.py:17-20", "logging_config.py:22-28"]
    answer:
      select: "logging_config.py:22-28"

  # Same challenge, FIX stage (reached after the locate success overlay's Continue). 4 candidate
  # solutions; solution 1 is correct — it adds a persistent 'file' handler (FileHandler → debug.log,
  # 'detailed'/timestamped formatter, INFO) AND an 'errors' handler (FileHandler → errors.log,
  # 'detailed', WARNING), and points the root logger at ['console','file','errors']. The distractors
  # (a textbook "compare ALL changed lines" trap — see the challenge-fix-compare-all memory): sol 2
  # GUTS both formatters (detailed → just asctime+name, simple → just name), losing level/module/
  # message; sol 3 references a 'file' handler in the root logger but NEVER DEFINES it (dictConfig
  # would raise ValueError) and sets its 'errors' handler to level ERROR, missing the WARNING-level
  # security events; sol 4 sets the root level to 'CRITICAL', suppressing everything below it. Solved
  # + validated live 2026-07-13 (→ "Bingo!"). No `file:` constraint here — the vulnerability category
  # alone is unique, and the fix-stage default open tab isn't guaranteed. NOTE: `select` is the
  # on-screen solution NUMBER; sol 1 and sol 3 are near-identical, so if SCW ever shuffles the order
  # this MUST move to content-matching (assert the right pane defines a 'file' handler, level WARNING).
  - id: insufficient-logging-fix
    match:
      stage: fix
      vulnerability_contains: "Insufficient Logging"
    answer:
      select: 1
