[project]
name = "trainee-sim"
version = "0.1.0"
description = "A test harness that drives a Selenium browser through training material — a server owns the live browser, a stateless CLI drives it, and a gated observer captures state so flows can be codified into rules."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "httpx>=0.28",
    "structlog>=24.4",
    "selenium>=4.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
trainee-sim = "trainee_sim.cli:main"

[[tool.uv.index]]
url = "https://nexus.corp.clover.com/repository/libs-python-local-group/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainee_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B904"]
