[project]
name = "webwalk"
version = "0.1.0"
description = "A harness that drives a Selenium browser through web flows: a flow-agnostic core (live-browser server + stateless CLI + observe→match→act→verify rule engine) with per-flow CLIs on top."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "httpx>=0.28",
    "structlog>=24.4",
    "selenium>=4.27",
    "pyyaml>=6.0",
    "transitions>=0.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[project.scripts]
webwalk = "webwalk.cli.core:main"
scw-sim = "webwalk.flows.scw.cli:main"
# A template flow (webwalk/flows/example) — copy it to start a new one.
example-sim = "webwalk.flows.example.cli:main"

#[[tool.uv.index]]
#url = "https://nexus.corp.clover.com/repository/libs-python-local-group/simple"
#default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webwalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B904"]
